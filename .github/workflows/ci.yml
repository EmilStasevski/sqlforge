name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # dev + serve groups only: the GPU training stack is not installed in CI (export tests skip)
      - run: uv sync --locked --no-default-groups --group dev --group serve
      - run: uv run --no-sync ruff check src tests scripts
      - run: uv run --no-sync ruff format --check src tests scripts
      - run: uv run --no-sync pytest -q

  rust:
    runs-on: ubuntu-latest
    if: ${{ hashFiles('rust/sqlnorm/Cargo.toml') != '' }}
    defaults:
      run:
        working-directory: rust/sqlnorm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/sqlnorm
      - run: cargo test --locked

  go:
    runs-on: ubuntu-latest
    if: ${{ hashFiles('go/gateway/go.mod') != '' }}
    defaults:
      run:
        working-directory: go/gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/gateway/go.mod
      - run: go test ./...
