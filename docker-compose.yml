# Day-1 skeleton: infrastructure services only. App services (gateway, executor, model server,
# kafka consumer) are added on Days 4-6 as they are built.
name: sqlforge

services:
  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]

  kafka:
    image: apache/kafka:3.9.0   # KRaft single node, no ZooKeeper
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    ports: ["8123:8123", "9000:9000"]
    environment:
      CLICKHOUSE_USER: sqlforge
      CLICKHOUSE_PASSWORD: sqlforge
    ulimits:
      nofile: { soft: 262144, hard: 262144 }

  minio:
    # Upstream minio/minio no longer publishes community images (checked 2026-11-21, see docs/env.md).
    image: bitnamilegacy/minio:2025.7.23
    ports: ["9002:9000", "9001:9001"]
    environment:
      MINIO_ROOT_USER: sqlforge
      MINIO_ROOT_PASSWORD: sqlforge-secret
    volumes: [minio:/bitnami/minio/data]

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.18.0
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow/mlflow.db --artifacts-destination /mlflow/artifacts
    ports: ["5000:5000"]
    volumes: [mlflow:/mlflow]

  prometheus:
    image: prom/prometheus:v2.55.0
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.3.0
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: sqlforge

volumes:
  minio:
  mlflow:
