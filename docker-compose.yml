# sqlforge serving + platform stack.  `make up` (needs data/db from `make data`, and runs/serve from `make gguf`
# for the model server).
name: sqlforge

x-pyapp: &pyapp
  build:
    context: .
    dockerfile: docker/python.Dockerfile
    network: host   # docker-bridge DNS is unreliable on some hosts; builds only need outbound HTTP
  image: sqlforge-py:latest

services:
  gateway:
    build: {context: go/gateway, network: host}
    ports: ["8080:8080"]
    environment:
      REDIS_ADDR: redis:6379
      EXECUTOR_URL: http://executor:8000
      KAFKA_BROKERS: kafka:19092
      KAFKA_TOPIC: ask.events
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      CACHE_TTL: 1h
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-0}
    depends_on: [redis, executor, kafka]

  executor:
    <<: *pyapp
    ports: ["8000:8000"]
    environment:
      MODEL_URL: http://ollama:11434/v1
      MODEL_NAME: sqlforge
      DB_DIR: /data/db
    volumes: ["./data/db:/data/db:ro"]
    depends_on: [ollama]

  consumer:
    <<: *pyapp
    command: ["python", "-m", "sqlforge.serve.consumer"]
    environment:
      KAFKA_BROKERS: kafka:19092
      CLICKHOUSE_HOST: clickhouse
    depends_on: [kafka, clickhouse]
    restart: on-failure

  ollama:
    # Model server: merged QLoRA adapter as GGUF Q4_K_M (runs/serve, built by `make gguf`).
    image: ollama/ollama:0.13.5
    entrypoint: ["/bin/sh", "/init.sh"]
    ports: ["11435:11434"]   # host port 11434 is usually taken by a host Ollama
    volumes:
      - ollama:/root/.ollama
      - ./runs/serve:/models:ro
      - ./docker/ollama-init.sh:/init.sh:ro
    environment:
      OLLAMA_KEEP_ALIVE: 24h
      OLLAMA_NUM_PARALLEL: 4
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: all, capabilities: [gpu]}]

  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]

  kafka:
    image: apache/kafka:3.9.0   # KRaft single node, no ZooKeeper
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    ports: ["8123:8123", "9000:9000"]
    environment:
      CLICKHOUSE_USER: sqlforge
      CLICKHOUSE_PASSWORD: sqlforge
    ulimits:
      nofile: { soft: 262144, hard: 262144 }

  minio:
    # Upstream minio/minio no longer publishes community images (checked 2026-11-21, see docs/env.md).
    image: bitnamilegacy/minio:2025.7.23
    ports: ["9002:9000", "9001:9001"]
    environment:
      MINIO_ROOT_USER: sqlforge
      MINIO_ROOT_PASSWORD: sqlforge-secret
    volumes: [minio:/bitnami/minio/data]

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.18.0
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow/mlflow.db --artifacts-destination /mlflow/artifacts
    ports: ["5000:5000"]
    volumes: [mlflow:/mlflow]

  prometheus:
    image: prom/prometheus:v2.55.0
    ports: ["9090:9090"]
    volumes: ["./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]

  grafana:
    build: {context: docker/grafana, network: host}
    image: sqlforge-grafana:latest
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: sqlforge
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus, clickhouse]

volumes:
  minio:
  mlflow:
  ollama:
