[project]
name = "sqlforge"
version = "0.1.0"
description = "German/English text-to-SQL, QLoRA-tuned on execution-verified synthetic data"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.1",
    "polars>=1.0",
    "pyarrow>=17",
    "pandera[polars]>=0.20",
    "pyyaml>=6",
    "requests>=2.32",
    "sqlnorm",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "sqlglot>=25"]
# Data pipeline tools (dbt, DVC, S3 client); not needed in CI.
pipeline = ["dbt-duckdb>=1.8", "dvc[s3]>=3.50", "boto3>=1.34"]
# Serving: FastAPI executor + Kafka->ClickHouse consumer.
serve = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27", "prometheus-client>=0.21", "confluent-kafka>=2.5", "clickhouse-connect>=0.8"]
# Demo UI (P2).
demo = ["streamlit>=1.40"]
# Heavy GPU stack; not installed in CI (`uv sync --group dev` only).
train = [
    "torch>=2.7",
    "transformers>=4.46",
    "peft>=0.13",
    "trl>=0.12",
    "bitsandbytes>=0.45",
    "accelerate>=1.0",
    "datasets>=3.0",
    "mlflow>=2.17",
    "wandb>=0.18",
]

[tool.uv]
default-groups = ["dev", "pipeline", "serve"]

# Blackwell (sm_120) needs CUDA >= 12.8 PyTorch wheels.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
sqlnorm = { path = "rust/sqlnorm" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sqlforge"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
