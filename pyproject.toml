[project]
name = "sqlforge"
version = "0.1.0"
description = "German/English text-to-SQL, QLoRA-tuned on execution-verified synthetic data"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.1",
    "polars>=1.0",
    "pyarrow>=17",
    "pandera[polars]>=0.20",
    "pyyaml>=6",
    "requests>=2.32",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]
# Heavy GPU stack; not installed in CI (`uv sync --group dev` only).
train = [
    "torch>=2.7",
    "transformers>=4.46",
    "peft>=0.13",
    "trl>=0.12",
    "bitsandbytes>=0.45",
    "accelerate>=1.0",
    "datasets>=3.0",
    "mlflow>=2.17",
    "wandb>=0.18",
]

[tool.uv]
default-groups = ["dev"]

# Blackwell (sm_120) needs CUDA >= 12.8 PyTorch wheels.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sqlforge"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
